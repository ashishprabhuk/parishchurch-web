services:
  webui:
    build: .
    restart: unless-stopped
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.webui.rule=Host(`churchofourladyoffatima.com`,`www.churchofourladyoffatima.com`)
      - traefik.http.routers.webui.entrypoints=websecure
      - traefik.http.routers.webui.tls.certresolver=letsencrypt
      - traefik.http.services.webui.loadbalancer.server.port=80

networks:
  traefik-proxy:
    external: true
